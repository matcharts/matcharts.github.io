<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="medias/favicon.ico">
<link rel="apple-touch-icon" href="medias/apple-touch-icon.png">
<meta name="description" content="Mat Charts, DJ professionnel à Montréal pour vos soirées et événements.">
<meta property="og:title" content="Mat Charts – DJ pour votre prochain événement">
<meta property="og:description" content="Découvrez Mat Charts, DJ professionnel à Montréal.">
<meta property="og:image" content="https://matcharts.ca/medias/og-image.jpg">
<meta property="og:url" content="https://matcharts.ca/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://matcharts.ca/medias/og-image.jpg">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<title>Mat Charts – DJ pour votre prochain événement</title>
</head>
<body>
<div class="page-container">
    <div class="content-wrap">
        <!-- Header -->
        <header class="navBar">
            <div class="logo">
                <a href="index.html">Mat Charts</a>
            </div>
            <nav class="nav_links">
                <a href="#main" id="linkHome"></a>
                <a href="#descendAbout" class="descendsAbout" id="linkAbout"></a>
                <a href="#descendEvent" class="descendsEvent" id="linkEvent"></a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="lang-switcher">
                <!-- Buttons JS compatible -->
                <button data-lang="fr" class="boutonLangue">FR</button>
                <button data-lang="en" class="boutonLangue">EN</button>
            </div>
        </header>

        <!-- Hero -->
        <section id="main" class="hero">
            <div id="fautBG">
                <h1>Mat Charts</h1>
                <p id="heroSubtitle"></p>
                <a href="contact.html" class="resa" id="heroButton"></a>
            </div>
        </section>

        <!-- Events -->
        <section class="events" id="descendEvent">
            <h2 id="eventsTitle"></h2>
            <div class="carousel-container">
                <button class="carousel-prev">❮</button>
                <div class="carousel" id="carouselEvents"></div>
                <button class="carousel-next">❯</button>
            </div>
        </section>

        <!-- About -->
        <section class="about" id="descendAbout">
            <div id="description">
                <h2 id="titre">À propos</h2>
                <div id="aboutTexts"></div>
                <div id="logo2">
                    <img src="medias/logo_sans_fond.png" alt="">
                </div>
            </div>
        </section>

        <!-- Testimonials -->
        <section class="testimonials-section">
            <h2 class="testimonials-title">Commentaires</h2>
            <div class="testimonial-container">
                <button class="arrow left-arrow">❮</button>
                <div id="testimonials"></div>
                <button class="arrow right-arrow">❯</button>
            </div>
            <div class="testimonial-dots"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div>
                <h2 id="tel">Contact</h2>
            </div>
            <div class="social-icons">
                <a href="https://www.instagram.com/mat_charts/">
                    <i class="fa fa-instagram scMedia"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61565653814244">
                    <i class="fa fa-facebook-f scMedia"></i>
                </a>
                <a href="https://www.youtube.com/@mat_charts">
                    <i class="fa fa-youtube-play scMedia"></i>
                </a>
            </div>
            <div class="copyright">
                <p>© 2025 Mathieu Chartier</p>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="script.js"></script>
</div>
</body>
</html>
