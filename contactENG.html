<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<title>Contact</title>
</head>
<body class="page-container">
<div class="content-wrap">

  <header class="navBar">
    <div class="logo"><a href="indexENG.html">Mat Charts</a></div>
    <nav class="nav_links">
      <a href="indexENG.html">Home</a>
      <a href="indexENG.html#descendAbout">About</a>
      <a href="indexENG.html#descendEvent">Events</a>
      <a href="contactENG.html">Contact</a>
    </nav>
    <div class="lang-switcher">
      <a href="contactENG.html" title="Version française">
        <img src="https://flagcdn.com/us.svg" alt="EN">
      </a>
    </div>
  </header>

  <section class="contact-section">
    <div class="contact-container">
      <h2>Contact</h2>
      <form action="https://formsubmit.co/chartier_m@outlook.com" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="Your e-mail" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone number *</label>
          <input type="text" id="phone" name="phone" placeholder="Your number" required>
        </div>
        <div class="form-group">
          <label for="date">Event date *</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
          <label for="horaire">Event time *</label>
          <select id="horaire" name="horaire" required>
            <option value="">--Choose a time--</option>
            <option value="8:00">8AM</option>
            <option value="9:00">9AM</option>
            <option value="10:00">10AM</option>
            <option value="11:00">11AM</option>
            <option value="12:00">12AM</option>
            <option value="13:00">1PM</option>
            <option value="14:00">2PM</option>
            <option value="15:00">3PM</option>
            <option value="16:00">4PM</option>
            <option value="17:00">5PM</option>
            <option value="18:00">6PM</option>
            <option value="19:00">7PM</option>
            <option value="20:00">8PM</option>
            <option value="21:00">9PM</option>
            <option value="22:00">10PM</option>
            <option value="23:00">11PM</option>
            <option value="00:00">12PM</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" placeholder="Your message..." rows="6" required></textarea>
        </div>

        <!-- minimal captcha / redirect setup -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://matcharts.ca/confirmeMailENG.html">

        <button type="submit" class="submit-btn">Send</button>
      </form>
    </div>
  </section>

</div>

<footer class="footer">
  <div><h2 id="tel">Contact</h2></div>
  <div class="social-icons">
    <a href="https://www.instagram.com/mat_charts/"><i class="fa fa-instagram scMedia"></i></a>
    <a href="https://www.facebook.com/profile.php?id=61565653814244"><i class="fa fa-facebook-f scMedia"></i></a>
    <a href="https://www.youtube.com/@mat_charts"><i class="fa fa-youtube-play scMedia"></i></a>
  </div>
  <div class="copyright"><p>© 2025 Mathieu Chartier</p></div>
</footer>

</body>
</html>
