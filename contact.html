<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Contact</title>
</head>
<body class="page-container">
    <div class="content-wrap">
        <!-- Header/Navigation Bar -->
        <header class="navBar">
            <div class="logo">
                <a href="index.html">Mat Charts</a>
            </div>
                <nav class="nav_links">
                    <a href="indexENG.html">Home</a>
                    <a href="indexENG.html#descendAbout" class="descends">About</a>
                    <a href="indexENG.html#descendEvent">Events</a>
                    <a href="contactENG.html">Contact</a>
                </nav>
            <div class="lang-switcher">
                <a href="contactENG.html" title="English version">
                    <img src="https://flagcdn.com/us.svg" alt="EN">
                </a>
            </div>
        </header>

        <section class="contact-section">
            <div class="contact-container">
            <h2>Contact</h2>
            <form id="contactForm"
      action="https://formsubmit.co/chartier.mathieu101@hotmail.fr"
      method="POST" class="contact-form">
  <div class="form-group">
    <label for="name">Nom *</label>
    <input type="text" id="name" name="name" placeholder="Votre nom" required>
  </div>
  <div class="form-group">
    <label for="email">Adresse e-mail *</label>
    <input type="email" id="email" name="email" placeholder="Votre e-mail" required>
  </div>
  <div class="form-group">
    <label for="phone">Numéro de téléphone *</label>
    <input type="text" id="phone" name="phone" placeholder="Votre numéro" required>
  </div>
  <div class="form-group">
    <label for="date">Date de l'événement *</label>
    <input type="date" id="date" name="date" required>
  </div>
  <div class="form-group">
    <label for="horaire">Heure de début de l'événement *</label>
    <select id="horaire" name="horaire" required>
      <!-- options... -->
    </select>
  </div>
  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Votre message..." rows="6" required></textarea>
  </div>

  <!-- keep captcha off -->
  <input type="hidden" name="_captcha" value="false">

  <!-- IMPORTANT: replace example.com with your real domain and full path -->
  <input type="hidden" name="_next" value="https://matcharts.ca/confirmeMail.html">

  <!-- ADD THIS hidden input so your script can write the selected equipment -->
  <input type="hidden" id="equipements-hidden" name="equipements" value="">

  <button type="submit" class="submit-btn">Envoyer</button>
</form>
            </div>
        </section>
    </div>

       <!-- Contact -->
                <!-- Footer -->
                <footer class="footer">
                    <div>
                        <h2 id="tel">Contact</h2>
                    </div>
                    <div class="social-icons">
                        <a href="https://www.instagram.com/mat_charts/" class="lienSC">
                            <i class="fa fa-instagram scMedia"></i>
                        </a>
                        <a href="https://www.facebook.com/profile.php?id=61565653814244" class="lienSC">
                            <i class="fa fa-facebook-f scMedia"></i>
                        </a>
                        <a href="https://www.youtube.com/@mat_charts" class="lienSC">
                            <i class="fa fa-youtube-play scMedia"></i>
                        </a>
                    </div>
                    <div class="copyright">
                        <p>© 2025 Mathieu Chartier</p>
                    </div>
                </footer>
    <script src="script.js"></script>
</body>
</html>
