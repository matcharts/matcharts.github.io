<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<title>Contact</title>
</head>

<body class="page-container">
<div class="content-wrap">

  <!-- NAV -->
  <header class="navBar">
    <div class="logo">
      <a id="logoLink">Mat Charts</a>
    </div>

    <nav class="nav_links">
      <a id="linkHome"></a>
      <a id="linkAbout"></a>
      <a id="linkEvent"></a>
      <a id="linkContact"></a>
    </nav>

    <div class="lang-switcher">
      <button id="switchLang" class="boutonLangue">EN</button>
    </div>
  </header>

  <!-- CONTACT -->
  <section class="contact-section">
    <div class="contact-container">
      <h2 id="contactTitle"></h2>

      <form action="https://formsubmit.co/chartier_m@outlook.com" method="POST" class="contact-form">

        <div class="form-group">
          <label id="labelName"></label>
          <input type="text" name="name" id="name" required>
        </div>

        <div class="form-group">
          <label id="labelEmail"></label>
          <input type="email" name="email" id="email" required>
        </div>

        <div class="form-group">
          <label id="labelPhone"></label>
          <input type="text" name="phone" id="phone" required>
        </div>

        <div class="form-group">
          <label id="labelDate"></label>
          <input type="date" name="date" required>
        </div>

        <div class="form-group">
          <label id="labelTime"></label>
          <select name="horaire" required>
            <option value="">--</option>
            <option>08:00</option><option>09:00</option><option>10:00</option>
            <option>11:00</option><option>12:00</option><option>13:00</option>
            <option>14:00</option><option>15:00</option><option>16:00</option>
            <option>17:00</option><option>18:00</option><option>19:00</option>
            <option>20:00</option><option>21:00</option><option>22:00</option>
            <option>23:00</option><option>00:00</option>
          </select>
        </div>

        <div class="form-group">
          <label id="labelMessage"></label>
          <textarea name="message" rows="6" required></textarea>
        </div>

        <input type="hidden" name="_captcha" value="true">
        <input type="hidden" id="nextPage" name="_next">

        <button type="submit" class="submit-btn" id="submitBtn"></button>
      </form>
    </div>
  </section>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div><h2>Contact</h2></div>
  <div class="social-icons">
    <a href="https://www.instagram.com/mat_charts/"><i class="fa fa-instagram scMedia"></i></a>
    <a href="https://www.facebook.com/profile.php?id=61565653814244"><i class="fa fa-facebook-f scMedia"></i></a>
    <a href="https://www.youtube.com/@mat_charts"><i class="fa fa-youtube-play scMedia"></i></a>
  </div>
  <div class="copyright">
    <p>© 2025 Mathieu Chartier</p>
  </div>
</footer>

<script src="contact.js" defer></script>
</body>
</html>
